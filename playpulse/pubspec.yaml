name: playpulse_app
description: Player Performance Prediction System with TinyML

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' 

# App version
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  
  # UI Components
  fl_chart: ^0.62.0
  provider: ^6.0.5
  shared_preferences: ^2.1.1
  
  # Networking
  http: ^1.0.0
  
  # TFLite and ML
  tflite_flutter: ^0.10.0 # For TensorFlow Lite models
  path_provider: ^2.0.15  # For storing models
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1


# Flutter configuration
flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    
  # Fonts
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
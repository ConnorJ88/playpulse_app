name: playpulse
description: Player Performance Prediction System

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' 

# Version information
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI related
  cupertino_icons: ^1.0.2
  fl_chart: ^0.55.0
  google_fonts: ^3.0.1
  
  # State management
  provider: ^6.0.3
  
  # Networking and storage
  http: ^0.13.5
  shared_preferences: ^2.0.15
  
  # Date and time
  intl: ^0.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

# Flutter configuration
flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    
  # Fonts
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic